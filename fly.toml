# See https://fly.io/docs/reference/configuration/
app = 'felixge'
primary_region = 'ams'

[build]
  [build.args]
    GO_VERSION = '1.22.2'

[env]
  PORT = '8080'
  DD_AGENT_HOST = 'felixge-datadog.internal'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
