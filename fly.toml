# See https://fly.io/docs/reference/configuration/
app = 'felixge'
primary_region = 'ams'

[build]
  [build.args]
    GO_VERSION = '1.22.2'

[env]
  PORT = '8080'
  DD_AGENT_HOST = 'felixge-datadog.internal'
  DD_ENV = 'prod'

[http_service]
  internal_port = 8080
  force_https = true
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
