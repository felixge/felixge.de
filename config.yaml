baseURL: "https://felixge.de/"
locale: "en-US"
title: "Felix Geisendörfer"
services:
  disqus:
    shortname: felixge
permalinks:
  posts: /:year/:month/:day/:slug/

# The homepage lists all posts; archive pages only need feeds.
outputs:
  section: [RSS]
  taxonomy: [RSS]
  term: [RSS]

# Keep old jekyll URL for RSS: /posts.atom.xml
outputFormats:
  RSS:
    mediatype: "application/rss+xml"
    baseName: "posts.atom"

theme: "felixge"
params:
  feedburnerShortname: felixge
  twitterShortname: felixge
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
