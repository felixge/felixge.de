# https://taskfile.dev/usage/
version: '3'

tasks:
  default:
    env:
      DATADOG: false
      EMBEDFS: false
    cmds:
      - air

  deploy:
    desc: Deploy the main Go application.
    cmds:
      - fly apps list | grep -E 'felixge ' || fly apps create felixge
      - fly deploy -e DD_VERSION="$(git describe --dirty --always)"

  deploy-all:
    desc: Deploy everything.
    deps: [deploy, deploy-datadog]

  deploy-datadog:
    desc: Deploy the datadog agent.
    cmds:
      - fly apps list | grep -E 'felixge-datadog ' || fly apps create felixge-datadog
      - fly deploy --config ./datadog.fly.toml
