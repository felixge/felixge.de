{{ define "main" -}}
<article class="home-document">
  <header class="home-introduction">
    <nav class="home-navigation" aria-label="Main navigation">
      <ul>
        {{ range (where .Site.RegularPages "Type" "pages").ByWeight }}
        {{ $homeLink := eq .File.ContentBaseName "about" }}
        <li><a id="{{ .File.ContentBaseName }}" href="{{ if $homeLink }}{{ $.Site.Home.RelPermalink }}{{ else }}{{ .RelPermalink }}{{ end }}"{{ if $homeLink }} aria-current="page"{{ end }}>{{ .Title }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </header>
  <div class="home-biography">
    {{ (.Site.GetPage "/about").Content }}
  </div>
</article>
{{- end }}
