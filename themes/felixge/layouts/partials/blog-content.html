{{ $page := .Page }}
{{ $page.Content }}
<p>You can subscribe to updates via <a href="{{ ($page.Site.Home.OutputFormats.Get "RSS").RelPermalink }}">RSS</a>.</p>

<table class="entries" aria-labelledby="{{ .Label }}">
  <thead>
    <tr><th scope="col">Post</th><th scope="col" class="date">Date</th></tr>
  </thead>
  <tbody>
  {{ range where $page.Site.RegularPages "Type" "posts" }}
    <tr>
      <td><a href="{{ .RelPermalink }}">{{ .Title }}</a></td>
      <td class="date"><time datetime="{{ .Date.Format "2006-01-02T15:04:05Z0700" }}" title="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2006" }}</time></td>
    </tr>
  {{ end }}
  </tbody>
</table>

<p>I have been blogging since 2006, my older posts can be found <a href="http://debuggable.com/posts/archive">here</a>.</p>
